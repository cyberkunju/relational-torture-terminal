<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you have brains - Soundness Diagnostics Runner</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Fira Code', monospace, sans-serif;
      padding: 2rem;
    }
    h1 {
      color: #00ff00;
      font-size: 1.5rem;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 0.5rem;
    }
    #console {
      background-color: #0d0d0d;
      border: 2px solid #333;
      padding: 1.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      line-height: 1.5;
      overflow-y: auto;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pass { color: #00ff00; }
    .fail { color: #ff007f; }
    .info { color: #00e5ff; }
    .warn { color: #ffaa00; }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button:hover {
      background: #2eff2e;
    }
  </style>
</head>
<body>
  <h1>DO YOU HAVE BRAINS: SOUNDNESS DIAGNOSTICS</h1>
  <button id="btn-run">RUN AUTOMATED TESTS (1000 Cases)</button>
  <div id="console">
    <span class="info">&gt; Ready. Click the button to start the compilation suite.</span>
  </div>

  <script src="generator.js?v=2"></script>
  <script>
    document.getElementById('btn-run').addEventListener('click', () => {
      const cons = document.getElementById('console');
      cons.innerHTML = '';
      
      const log = (text, type = 'info') => {
        const span = document.createElement('span');
        span.className = type;
        span.innerHTML = text;
        cons.appendChild(span);
        cons.scrollTop = cons.scrollHeight;
      };

      log('&gt; Initializing soundness check across all modifiers...', 'info');
      log('&gt; Generating 200 cases per mode (Total: 1000 runs)...', 'info');

      const modes = ['network', 'git', 'dependency', 'inheritance', 'logic'];
      let passed = 0;
      let failed = 0;
      let total = 0;
      
      setTimeout(() => {
        modes.forEach(mode => {
          log(`&gt; Testing Mode: [${mode.toUpperCase()}]`, 'info');
          let modePass = 0;
          let modeFail = 0;

          for (let i = 0; i < 200; i++) {
            total++;
            const numPremises = 2 + Math.floor(Math.random() * 7); // 2 to 8 premises
            
            // Randomize modifiers
            const modGibberish = Math.random() > 0.5;
            const modNegation = Math.random() > 0.5;

            try {
              const puzzle = Generator.generate(mode, numPremises, {
                gibberish: modGibberish,
                negation: modNegation
              });

              // Structural Assertions
              if (!puzzle.mode || puzzle.mode !== mode) throw new Error('Invalid mode field');
              if (!puzzle.title || !puzzle.instruction) throw new Error('Missing title or instruction');
              if (!puzzle.premises || !Array.isArray(puzzle.premises) || puzzle.premises.length === 0) {
                throw new Error('Premises array missing or empty');
              }
              if (!puzzle.conclusion || typeof puzzle.conclusion !== 'string') {
                throw new Error('Conclusion missing or invalid');
              }
              if (typeof puzzle.correctAnswer !== 'boolean') {
                throw new Error('correctAnswer must be a boolean');
              }
              if (!puzzle.graphData || !puzzle.graphData.nodes || !puzzle.graphData.edges) {
                throw new Error('Missing graphData nodes/edges');
              }

              // Verify unique premises
              const uniquePremises = new Set(puzzle.premises);
              if (uniquePremises.size !== puzzle.premises.length) {
                throw new Error('Duplicate premises generated: ' + JSON.stringify(puzzle.premises));
              }

              // Verify gibberish mapping consistency if active
              if (modGibberish) {
                // Ensure default vocabulary names do not appear in the generated strings
                const originalWords = ['Router-', 'feature-', 'Module', 'Class', 'Signal-'];
                originalWords.forEach(w => {
                  if (puzzle.premises.some(p => p.includes(w)) && mode !== 'logic') {
                    // Logic mode signals might not be scrambled if not defined in the mapper, but let's check
                    throw new Error(`Scramble leak: Original node pattern "${w}" found in premise`);
                  }
                });
              }

              modePass++;
              passed++;
            } catch (err) {
              modeFail++;
              failed++;
              log(`  [FAIL Case ${i}]: ${err.message}`, 'fail');
            }
          }

          log(`  -&gt; Pass: ${modePass}/200 | Failures: ${modeFail}`, modeFail === 0 ? 'pass' : 'fail');
        });

        log('<br>===================== DIAGNOSTIC VERDICT =====================', 'info');
        log(`Total Runs: ${total}`, 'info');
        log(`Passed Cases: ${passed}`, 'pass');
        log(`Failed Cases: ${failed}`, failed === 0 ? 'pass' : 'fail');
        if (failed === 0) {
          log('STATUS: COMPILATION SUCCESSFUL. All systems sound.', 'pass');
        } else {
          log('STATUS: CRITICAL FAILURE. Relational frame compromises detected.', 'fail');
        }
      }, 50);
    });
  </script>
</body>
</html>
